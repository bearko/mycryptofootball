<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>スタジアム実験室</title>
    <!-- development only: not linked from the game. Assets resolve from the site root. -->
    <base href="/" />
    <style>
      html, body { margin: 0; height: 100%; background: #04071a; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #e8eeff; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .inset { position: absolute; left: 0; right: 0; background: rgba(20, 30, 70, 0.45); border: 1px dashed rgba(255, 255, 255, 0.5); box-sizing: border-box;
        display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.7); pointer-events: none; transition: height 0.35s ease; overflow: hidden; }
      #inset-top { top: 0; }
      #inset-bottom { bottom: 0; }
      #tag { position: absolute; transform: translate(-50%, 0); padding: 1px 6px; border-radius: 3px; background: rgba(8, 12, 30, 0.8); white-space: nowrap; pointer-events: none; display: none; }
      #bar { position: fixed; left: 4px; top: 4px; right: 4px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; z-index: 5; }
      #bar button, #bar label { background: rgba(10, 16, 40, 0.82); color: #e8eeff; border: 1px solid rgba(160, 180, 255, 0.4); border-radius: 4px; padding: 3px 7px; font: inherit; cursor: pointer; }
      #bar button.on { background: #2b4fc0; }
      #bar .sep { width: 6px; }
      #info { position: fixed; left: 6px; bottom: 6px; z-index: 5; background: rgba(8, 12, 30, 0.7); padding: 3px 7px; border-radius: 4px; white-space: pre; pointer-events: none; }
      body.bare #bar, body.bare #info { display: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="inset-top" class="inset">スコア表示がここに重なる</div>
      <div id="inset-bottom" class="inset">作戦カードがここに重なる</div>
      <div id="tag"></div>
    </div>
    <div id="bar"></div>
    <div id="info"></div>
    <script type="module" src="/lab/stadium.ts"></script>
  </body>
</html>
