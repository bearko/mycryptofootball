<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- asset URLs in the catalog are relative to the site root -->
    <base href="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>音の実験室 — My Crypto Football</title>
    <style>
      :root {
        --night: #090d24; --indigo: #171c4f; --violet: #2a2f80; --ink: #06081a; --yellow: #ffe14a; --orange: #ff5a2e;
        --cyan: #37e3ff; --lime: #9dff5c; --pink: #ff5a7a; --chalk: #fffbe8; --dim: #aab3dd; --paper: #f5ecd0;
        --line: rgba(255, 251, 232, 0.16);
        --display: 'Dela Gothic One', 'DotGothic16', sans-serif;
        --body: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        min-height: 100vh; color: var(--chalk); font-family: var(--body); line-height: 1.5;
        background: radial-gradient(120% 80% at 50% -10%, #1b2166 0%, var(--night) 60%) fixed;
      }
      header {
        position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
        padding: 12px 20px; background: rgba(6, 8, 26, 0.92); border-bottom: 3px solid var(--yellow);
      }
      h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; letter-spacing: 0.04em; color: var(--yellow); transform: skewX(-8deg); }
      h1 small { font-family: var(--body); font-size: 0.8rem; color: var(--dim); margin-left: 10px; }
      #status { font-size: 0.85rem; color: var(--dim); min-width: 15em; }
      #status b { color: var(--lime); font-weight: 400; }
      #status b.off { color: var(--pink); }
      #meter { width: 320px; max-width: 100%; height: 44px; background: var(--ink); border: 1px solid var(--line); }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 16px 20px 60px; align-items: start; }
      section { background: rgba(23, 28, 79, 0.72); border: 1px solid var(--line); box-shadow: 5px 5px 0 var(--ink); padding: 12px 14px 14px; }
      section.wide { grid-column: 1 / -1; }
      h2 { font-family: var(--display); font-weight: 400; font-size: 1.05rem; color: var(--cyan); margin-bottom: 2px; }
      section > p { font-size: 0.8rem; color: var(--dim); margin-bottom: 10px; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
      button {
        font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--paper); border: 0; padding: 0 12px; min-height: 44px; min-width: 44px;
        cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform 0.06s;
      }
      button small { display: block; font-size: 0.66rem; color: #6b6450; font-family: ui-monospace, monospace; line-height: 1.1; }
      button:hover { background: #fff; }
      button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
      button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
      button.hot { background: var(--yellow); }
      button.cold { background: #c9d2ff; }
      button.on { background: var(--lime); }
      label.slider { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--dim); }
      label.slider input { width: 120px; accent-color: var(--yellow); }
      label.slider output { min-width: 2.6em; color: var(--chalk); font-family: ui-monospace, monospace; }
      #log { margin-top: 10px; font-size: 0.85rem; color: var(--chalk); min-height: 1.5em; max-height: 14em; overflow: auto; }
      #log div { border-left: 3px solid var(--orange); padding-left: 8px; margin-top: 3px; }
      #log time { color: var(--dim); font-family: ui-monospace, monospace; margin-right: 8px; }
      table { border-collapse: collapse; width: 100%; font-size: 0.8rem; margin-top: 10px; font-family: ui-monospace, monospace; }
      th, td { padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
      th { color: var(--cyan); font-weight: 400; position: sticky; top: 0; }
      td.bad { color: var(--pink); }
      td.ok { color: var(--lime); }
      .bar { display: inline-block; height: 8px; background: var(--yellow); vertical-align: middle; margin-left: 6px; }
      .tablewrap { overflow: auto; max-height: 70vh; }
      #verdict { margin-top: 8px; font-size: 0.9rem; }
      #verdict div.bad { color: var(--pink); }
      #verdict div.ok { color: var(--lime); }
    </style>
  </head>
  <body>
    <header>
      <h1>音の実験室<small>開発用・ゲームからはリンクしない</small></h1>
      <div id="status"></div>
      <canvas id="meter" width="640" height="88" aria-label="出力メーター"></canvas>
    </header>
    <main id="board"></main>
    <script type="module" src="lab/audio.ts"></script>
  </body>
</html>
